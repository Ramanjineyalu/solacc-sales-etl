bundle:
  name: solacc_sales_etl

resources:
  jobs:
    sales_etl_pipeline:
      name: solacc_sales_etl_${bundle.target}
      tasks:
        - task_key: generate_data
          notebook_task:
            notebook_path: ./01_Generate_Data.py

        - task_key: bronze_ingest
          depends_on:
            - task_key: generate_data
          notebook_task:
            notebook_path: ./02_Bronze_Ingest.py

        - task_key: silver_transform
          depends_on:
            - task_key: bronze_ingest
          notebook_task:
            notebook_path: ./03_Silver_Transform.py

        - task_key: gold_aggregates
          depends_on:
            - task_key: silver_transform
          notebook_task:
            notebook_path: ./04_Gold_Aggregates.py

        - task_key: validate
          depends_on:
            - task_key: gold_aggregates
          notebook_task:
            notebook_path: ./05_Validate.py

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-a70bf218-7972.cloud.databricks.com/
